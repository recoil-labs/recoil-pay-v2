[package]
name = "oif-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
oif-types = { path = "../types" }
oif-storage = { path = "../storage" }
oif-adapters = { path = "../adapters" }
oif-config = { path = "../config" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.9"
regex = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
# On-chain settlement for gift card trades: verifying a lock really landed,
# and sending the release that pays it out.
alloy-primitives = { version = "1.0", features = ["std", "serde", "k256"] }
alloy-provider = { version = "1.0", features = ["rpc-api"] }
alloy-rpc-types-eth = "1.0"
alloy-network = "1.0"
alloy-signer = "1.0"
alloy-signer-local = "1.0"
alloy-sol-types = { version = "1.0", features = ["json"] }
sha2 = "0.10"
utoipa = { version = "5.0", optional = true, features = ["chrono", "uuid"] }

[dev-dependencies]
mockall = "0.13"

[features]
openapi = ["dep:utoipa"]
