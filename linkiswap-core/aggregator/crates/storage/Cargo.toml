[package]
name = "oif-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
oif-types = { path = "../types" }
oif-config = { path = "../config" }
async-trait = "0.1"
dashmap = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "json", "uuid", "chrono"], optional = true }

[features]
default = ["memory", "postgres"]
memory = []
postgres = ["dep:sqlx"]
