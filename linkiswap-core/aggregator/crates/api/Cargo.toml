[package]
name = "oif-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
oif-types = { path = "../types" }
oif-service = { path = "../service" }
oif-storage = { path = "../storage" }
oif-config = { path = "../config" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["limit", "cors", "compression-full", "trace", "request-id", "set-header"] }
tower = "0.5"
tracing = "0.1"
utoipa = { version = "5.0", optional = true }
utoipa-axum = { version = "0.2", optional = true }
# `vendored` embeds the Swagger UI dist in the crate. Without it, this
# crate's build script shells out to the `curl` binary to fetch
# swagger-ui v5.17.14 from GitHub at compile time — which fails in the
# Chainguard builder image (no curl installed) and makes every release
# build depend on GitHub being reachable.
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum", "vendored"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"
async-trait = "0.1"
rand = "0.9"
uuid = { version = "1.18", features = ["v4"] }
futures = "0.3"
jsonwebtoken = "8.3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
# Random API key + sha256 hashing for /solver-api/operators/{id}/api-key
getrandom = "0.2"
hex = "0.4"
# Operator-signed-request auth middleware (fill-worker → aggregator).
# Reuses alloy's secp256k1 ecrecover so the server verifies the same
# signature scheme the fill-worker produces in `fill-worker::auth`.
alloy-primitives = { version = "1.0", features = ["std", "k256"] }
alloy-sol-types = { version = "1.0", features = ["json"] }
alloy-signer = "1.0"
alloy-signer-local = "1.0"

[dev-dependencies]
# Used by solver_api::tests to sign canonical EIP-191 test vectors
# against the verify_register_signature helper.
alloy-signer = "1.0"
alloy-signer-local = "1.0"

[features]
openapi = ["utoipa", "utoipa-axum", "utoipa-swagger-ui", "oif-types/openapi", "oif-service/openapi", "oif-config/openapi"]
