[package]
name = "oif-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
oif-types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
dotenvy = "0.15"
thiserror = "2.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
utoipa = { version = "5.0", optional = true }

[features]
# Derives `ToSchema` on the chain registry types so `/api/v1/chains` can be
# documented in the OpenAPI spec alongside every other public route.
openapi = ["utoipa", "oif-types/openapi"]
