# Render Blueprint for the LinkiSwap V2 intent UI (static site).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Talks to the live OIF aggregator; no backend of its own.
services:
  - type: web
    name: linkiswap-v2
    runtime: static
    branch: master
    # --legacy-peer-deps: RainbowKit 2.x peers wagmi@^2 but the app runs
    # wagmi@3 (works at runtime); skip npm's strict peer check on clean install.
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    # SPA fallback so deep links / refreshes resolve to the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render auto-runs `npm install` BEFORE buildCommand; this makes that
      # pre-install (and every npm call) skip the strict peer check, so the
      # RainbowKit(peer wagmi@^2) vs wagmi@3 mismatch doesn't fail the build.
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
      # Base URL of the aggregator the intent UI calls. This is the
      # multi-tenant marketplace aggregator — quotes come from operators
      # who registered in the solver portal, and its hosted fill-worker
      # settles the swap. The previous value (oif-aggregator) was the
      # standalone OIF stack, which no longer runs and returns 503; the
      # browser surfaces that as a CORS error because Render's 503 page
      # carries no CORS headers.
      - key: VITE_OIF_API_BASE_URL
        value: https://linkiswap-aggregator.onrender.com
      # Public WalletConnect/Reown project id (ships in the bundle).
      # Reuses the id the core demo UI already uses; injected wallets
      # (MetaMask) work without it. Override in the dashboard if you
      # want a dedicated project with this domain allow-listed.
      - key: VITE_WALLETCONNECT_PROJECT_ID
        value: e0a1b3a2a85284ebdca25f4bbdab1efe
      # Ghost blog (blog.linkiswap.com) Content API. The homepage "From the
      # blog" section and newsletter subscribe block use these. The Content
      # API key is read-only and designed to ship in the client bundle.
      - key: VITE_GHOST_API_URL
        value: https://blog.linkiswap.com
      - key: VITE_GHOST_CONTENT_KEY
        value: b7b8a55d27339a0bf9fe906c10
