# Render Blueprint — LinkiSwap operator dashboard (solver portal).
#
# Static Vite/React build. Operators use this to register, publish
# quotes, fund their fill-wallet and watch orders settle. It talks
# exclusively to the aggregator's HTTP API; there is no backend here.
#
# `repo` must match the repository this file lives in. It previously
# pointed at .../admin-ui, so the blueprint described a different
# codebase than the one it shipped with — deploying it would have built
# the wrong app.

services:
  - type: web
    name: linkiswap-solver-portal
    runtime: static
    repo: https://github.com/linki-swap/solvers
    branch: master
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true

    # React Router owns the URL space, so every unmatched path has to
    # fall through to the SPA shell or a refresh on /orders 404s.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    envVars:
      # Vite inlines these at build time — they end up readable in the
      # shipped bundle, so only ever put public values here.
      - key: VITE_API_BASE_URL
        value: https://linkiswap-aggregator.onrender.com
      - key: VITE_OIF_API_BASE_URL
        value: https://linkiswap-aggregator.onrender.com
      - key: VITE_SOLVER_API_BASE_URL
        value: https://linkiswap-aggregator.onrender.com
