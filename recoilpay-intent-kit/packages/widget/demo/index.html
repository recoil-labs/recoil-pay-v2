<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RecoilPay intent widget — demo</title>
    <style>
      body {
        margin: 0;
        padding: 48px 20px;
        background: #0f1017;
        color: #e9e9ed;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-weight: 500;
        font-size: 22px;
      }
      pre {
        overflow-x: auto;
        padding: 12px;
        border: 1px solid #2a2c3d;
        border-radius: 8px;
        font-size: 12px;
      }
    </style>
    <!-- 1. Load the widget once, anywhere on the page. -->
    <script type="module" src="../dist/recoilpay-intent-widget.js"></script>
  </head>
  <body>
    <main>
      <h1>Swap with RecoilPay</h1>

      <!-- 2. Place it. Everything except the tag name is optional. -->
      <recoilpay-intent
        walletconnect-project-id=""
        mode="dark"
      ></recoilpay-intent>

      <h2 style="font-size: 14px; font-weight: 500; margin-top: 40px">Events</h2>
      <pre id="log">(none yet)</pre>
    </main>

    <script>
      // 3. Optional: react to what happens.
      const log = document.getElementById('log');
      for (const name of ['recoilpay-wallet', 'recoilpay-order-submitted', 'recoilpay-complete', 'recoilpay-error']) {
        document.addEventListener(name, (e) => {
          if (log.textContent === '(none yet)') log.textContent = '';
          log.textContent += `${name} ${JSON.stringify(e.detail)}\n`;
        });
      }
    </script>
  </body>
</html>
